<!DOCTYPE html>
<html lang="ar" dir="rtl" data-t="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Under Pressure — تحت الضغط</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --A:#4D88E8; --B:#40BDA9; --amber:#FFBC3A; --coral:#F26A44; --ink:#080828;
 --bg:#E9EDF7; --panel:#FFFFFF; --sunk:#F3F6FC; --edge:#DEE5F3; --line:#E9EEF8; --line2:#C6D2E8;
 --tx:#0A0F2E; --mu:#4E5874; --fa:#7D87A6; --seat:#C3CFE6;
 --sh:0 1px 2px rgba(12,20,60,.05),0 16px 36px -26px rgba(12,20,60,.5);
 --shUp:0 -8px 32px -24px rgba(12,20,60,.55);
 --r:18px; --r2:12px; --ez:cubic-bezier(.25,.6,.35,1);
 --f:'Inter','Noto Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
 color-scheme:light;
}
html[dir=rtl]{--f:'Noto Sans Arabic','Inter',system-ui,-apple-system,sans-serif}
@media(prefers-color-scheme:dark){html[data-t=auto]{
 --bg:#05060F; --panel:#101433; --sunk:#0A0D24; --edge:#232A52; --line:#1D2347; --line2:#353D6C;
 --tx:#EEF2FC; --mu:#A4ADCB; --fa:#747DA3; --seat:#2F376A; --A:#6FA0F0; --B:#4ECCB6;
 --sh:0 1px 2px rgba(0,0,0,.4),0 20px 44px -30px #000; color-scheme:dark;}}
html[data-t=dark]{
 --bg:#05060F; --panel:#101433; --sunk:#0A0D24; --edge:#232A52; --line:#1D2347; --line2:#353D6C;
 --tx:#EEF2FC; --mu:#A4ADCB; --fa:#747DA3; --seat:#2F376A; --A:#6FA0F0; --B:#4ECCB6;
 --sh:0 1px 2px rgba(0,0,0,.4),0 20px 44px -30px #000; color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
body{background:var(--bg);color:var(--tx);font-family:var(--f);font-size:15px;line-height:1.55;
 -webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-25%;z-index:-2;pointer-events:none;
 background:
  radial-gradient(46% 38% at 12% 0%, rgba(77,136,232,.34), transparent 64%),
  radial-gradient(40% 34% at 92% 6%, rgba(64,189,169,.26), transparent 62%),
  radial-gradient(50% 44% at 80% 100%, rgba(255,188,58,.18), transparent 64%)}
html[data-t=dark] body::before{opacity:.5}
@media(prefers-color-scheme:dark){html[data-t=auto] body::before{opacity:.5}}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
 background-image:linear-gradient(to right,rgba(12,20,60,.04) 1px,transparent 1px),
  linear-gradient(to bottom,rgba(12,20,60,.04) 1px,transparent 1px);background-size:32px 32px}
html[data-t=dark] body::after{background-image:linear-gradient(to right,rgba(255,255,255,.03) 1px,transparent 1px),
  linear-gradient(to bottom,rgba(255,255,255,.03) 1px,transparent 1px)}
h1,h2,h3{margin:0;font-weight:800;line-height:1.14;letter-spacing:-.03em}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;font-family:var(--f)}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--A);outline-offset:3px;border-radius:10px}
.n{font-family:'Inter',var(--f);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo{height:22px;width:auto;color:var(--tx);display:block}

/* ===== chrome ===== */
.bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 18px;
 background:color-mix(in srgb,var(--panel) 86%,transparent);border-bottom:1px solid var(--edge);
 backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);flex-wrap:wrap}
.sp{flex:1}
.ic{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:34px;padding:0 10px;
 border:1px solid var(--line2);border-radius:10px;font-size:13px;color:var(--mu);
 transition:background .18s var(--ez),color .18s var(--ez),border-color .18s var(--ez)}
.ic:hover{border-color:var(--A);color:var(--A)}
.clock{font-size:21px;font-weight:800;letter-spacing:-.04em;
 background:linear-gradient(130deg,var(--tx),var(--A));-webkit-background-clip:text;background-clip:text;color:transparent}
main{max-width:1180px;margin:0 auto;padding:18px 18px 40px;width:100%}

/* ===== stage rail ===== */
.rail{display:flex;border:1px solid var(--edge);border-radius:var(--r);background:var(--panel);
 box-shadow:var(--sh);overflow:hidden;margin-bottom:16px}
.rl{flex:1;display:flex;align-items:center;gap:11px;padding:13px 16px;position:relative;border-inline-start:1px solid var(--line)}
.rl:first-child{border-inline-start:none}
.rl .no{width:27px;height:27px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
 font-size:12.5px;font-weight:800;background:var(--sunk);color:var(--fa);border:1px solid var(--edge)}
.rl.on .no{background:linear-gradient(135deg,var(--A),#7FB0F7);color:#fff;border-color:transparent;box-shadow:0 6px 16px -8px var(--A)}
.rl.dn .no{background:var(--B);color:#04241F;border-color:transparent}
.rl b{font-size:13.5px;font-weight:700;color:var(--fa)}
.rl.on b{color:var(--tx)} .rl.dn b{color:var(--mu)}
.rl.on::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--A),var(--B))}

/* ===== task strip ===== */
.task{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:13px 16px;margin-bottom:16px;
 background:linear-gradient(104deg,rgba(8,8,40,.95),rgba(32,42,98,.92));color:#fff;border:1px solid rgba(255,255,255,.1)}
html[data-t=dark] .task{background:linear-gradient(104deg,rgba(26,32,76,.85),rgba(12,16,44,.85))}
.task b{font-size:14.5px;white-space:nowrap} .task span{font-size:13.5px;opacity:.84;line-height:1.5}

/* ===== panels ===== */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{border:1px solid var(--edge);border-radius:var(--r);background:var(--panel);box-shadow:var(--sh);overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.ch b{font-size:14px;font-weight:700}
.cb{padding:15px 16px}
.team{position:relative}
.team::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px}
.team.tA::before{background:var(--A)} .team.tB::before{background:var(--B)}
.tname{font-size:16px;font-weight:800}
.tlead{font-size:12.5px;color:var(--fa)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.m{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px}
.m .k{font-size:10.5px;color:var(--fa);font-weight:700;letter-spacing:.04em}
.m .v{font-size:25px;font-weight:800;letter-spacing:-.035em;line-height:1.1;margin-top:3px}
.m .u{font-size:10.5px;color:var(--fa);margin-top:1px}
.delta{font-size:12px;font-weight:800;margin-inline-start:5px}
.up{color:var(--coral)} .dn{color:var(--B)} .z{color:var(--fa)}
.seats{display:flex;gap:5px;flex-wrap:wrap;margin-top:14px;min-height:26px}
.seat{width:16px;height:24px;border-radius:5px;background:var(--line2);transition:background .3s var(--ez),transform .3s var(--ez)}
.seat.aA{background:var(--A)} .seat.aB{background:var(--B)}
.seat.lent{background:var(--amber)}
.seat.ghost{background:transparent;border:1.5px dashed var(--seat)}
.qbar{display:flex;gap:3px;flex-wrap:wrap;margin-top:12px;min-height:20px}
.qt{width:7px;height:18px;border-radius:2px;background:var(--line2)}
.qt.inA{background:var(--A)} .qt.inB{background:var(--B)}
.qt.over{background:var(--amber)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mu);margin-top:10px}
.legend i{width:9px;height:11px;border-radius:2px;display:inline-block;margin-inline-end:5px;vertical-align:-1px}

/* ===== choices ===== */
.choices{display:grid;gap:11px;margin-top:14px}
.ch-btn{position:relative;width:100%;text-align:inherit;border:2px solid var(--line2);border-radius:var(--r);
 background:var(--panel);padding:15px 17px 15px 19px;
 transition:border-color .2s var(--ez),background .2s var(--ez),box-shadow .2s var(--ez)}
html[dir=rtl] .ch-btn{padding:15px 19px 15px 17px}
.ch-btn::before{content:"";position:absolute;inset-inline-start:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--line2);transition:background .2s var(--ez)}
.ch-btn:hover{border-color:var(--A)}
.ch-btn[aria-pressed=true]{border-color:var(--A);background:color-mix(in srgb,var(--A) 8%,var(--panel));box-shadow:0 12px 30px -22px var(--A)}
.ch-btn[aria-pressed=true]::before{background:linear-gradient(180deg,var(--A),var(--B))}
.ch-hd{display:flex;gap:12px;align-items:flex-start}
.mark{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);flex:none;margin-top:1px;position:relative;
 transition:border-color .2s var(--ez)}
.ch-btn[aria-pressed=true] .mark{border-color:var(--A);border-width:7px}
.ch-ttl{font-size:15px;font-weight:700}
.pick-tag{font-size:11px;font-weight:800;border-radius:20px;padding:3px 10px;background:var(--sunk);color:var(--fa);
 border:1px solid var(--edge);margin-inline-start:auto;flex:none}
.ch-btn[aria-pressed=true] .pick-tag{background:var(--A);color:#fff;border-color:transparent}
.prev{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-top:13px}
.pv{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r2);padding:9px 11px}
.pv .k{font-size:10.5px;color:var(--fa);font-weight:700}
.pv .v{font-size:14px;font-weight:600;margin-top:2px}
.arw{color:var(--fa);margin:0 5px;font-weight:400}

/* ===== cta ===== */
.cta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}
.btn{border-radius:13px;padding:13px 24px;font-weight:700;font-size:15.5px;display:inline-flex;gap:9px;align-items:center;
 background:linear-gradient(135deg,var(--A),#7FB0F7);color:#fff;box-shadow:0 14px 30px -18px var(--A);
 transition:background .2s var(--ez),box-shadow .2s var(--ez),opacity .2s var(--ez)}
.btn:hover:not(:disabled){box-shadow:0 18px 36px -18px var(--A)}
.btn:disabled{opacity:.4;box-shadow:none}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line2);box-shadow:none;font-weight:600}
.btn.ghost:hover:not(:disabled){background:var(--sunk);border-color:var(--A)}
.btn.sm{padding:9px 16px;font-size:13.5px}
.hint{font-size:12.5px;color:var(--fa);line-height:1.5}

/* ===== chart ===== */
.chart{width:100%;height:auto;display:block}
.tick{font-size:10px;fill:var(--fa);font-family:'Inter',sans-serif}

/* ===== log ===== */
.log{max-height:280px;overflow:auto}
.lg-row{display:grid;grid-template-columns:54px 1fr;gap:12px;padding:11px 16px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5}
.lg-row:first-child{border-top:none}
.lg-t{font-size:12px;font-weight:800;color:var(--A)}
.lg-row.sup{background:color-mix(in srgb,var(--amber) 11%,transparent)}
.msg{display:block;padding:11px 16px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5}
.msg b{color:var(--A)}

/* ===== summary ===== */
.sum{display:grid;gap:13px;margin-top:16px}
.sbox{border:1px solid var(--edge);border-radius:var(--r);background:var(--panel);box-shadow:var(--sh);overflow:hidden}
.sbox .sh{display:flex;gap:11px;align-items:center;padding:14px 17px;border-bottom:1px solid var(--line)}
.sbox .sn{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--A),var(--B));color:#fff;
 display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;flex:none}
.sbox .sh b{font-size:14.5px;font-weight:700}
.sbox .sbd{padding:15px 17px;font-size:14px;line-height:1.75;color:var(--mu)}
.sbox .sbd b{color:var(--tx)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:12px}
.fact{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r2);padding:11px 13px}
.fact .k{font-size:10.5px;color:var(--fa);font-weight:700}
.fact .v{font-size:19px;font-weight:800;letter-spacing:-.03em;margin-top:2px;color:var(--tx)}
.qpair{display:grid;gap:10px;margin-top:14px}
.qq{border-inline-start:3px solid var(--A);padding:4px 0 4px 14px;font-size:14.5px;color:var(--tx);font-weight:600}
html[dir=rtl] .qq{padding:4px 14px 4px 0}

/* ===== intro ===== */
.intro{display:grid;grid-template-columns:1.05fr .95fr;gap:42px;align-items:center;min-height:62vh}
.ht{font-size:clamp(40px,7vw,80px);font-weight:800;letter-spacing:-.055em;line-height:.94}
.ht em{font-style:normal;display:block;background:linear-gradient(110deg,var(--A),var(--B) 72%);
 -webkit-background-clip:text;background-clip:text;color:transparent}
.hs{font-size:clamp(15px,1.6vw,17.5px);color:var(--mu);margin-top:18px;line-height:1.65;max-width:46ch}
.note{font-size:12.5px;color:var(--fa);margin-top:16px;padding:9px 13px;border:1px dashed var(--line2);border-radius:var(--r2);display:inline-block}

/* ===== motion: only real events animate ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.reveal{animation:fadeUp .4s var(--ez) both}
.seat.moving{animation:seatPop .5s var(--ez) both}
@keyframes seatPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:dr 1s var(--ez) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:900px){
 .intro{grid-template-columns:1fr;gap:26px;min-height:0}
 .grid2{grid-template-columns:1fr}
 .rail{flex-direction:column}
 .rl{border-inline-start:none;border-top:1px solid var(--line)}
 .rl:first-child{border-top:none}
 .rl.on::after{inset-inline:0;bottom:0}
 main{padding:14px 13px 34px}
 .metrics{grid-template-columns:repeat(3,1fr);gap:7px}
 .m .v{font-size:21px}
 .task{flex-direction:column;gap:4px}
 .task b{white-space:normal}
}
</style>
</head>

<script>
"use strict";
/* ===================== DATA (scenario constants) ===================== */
const TEAM={
 A:{id:"A",lead:"Mona Said",agents0:6,aht:300,q0:9,arr:[14,14,15,14,13,13]},
 B:{id:"B",lead:"Tarek Nabil",agents0:8,aht:360,q0:3,arr:[11,11,12,11,11,11]}
};
const KEYS=["A","B"];
const TOTAL_AGENTS=TEAM.A.agents0+TEAM.B.agents0;        /* 14, constant */
const CLK=["10:30","10:40","10:50","11:00","11:10","11:20","11:30"];
const clk=i=>CLK[Math.max(0,Math.min(6,i))];
const h=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mq=q=>(window.matchMedia?window.matchMedia(q):{matches:false});
const t=o=>(o&&typeof o==="object"&&!Array.isArray(o))?(o[S.lang]||o.en):o;
const t2=(ar,en)=>({ar,en});

/* ===================== ENGINE ===================== */
/* transferred agents during period i, from the two committed decisions */
function transferAt(d1,d2,i){
 const n1=d1||0;
 if(n1>0){
  if(i===1||i===2)return n1;                      /* starts 10:40, initial end 11:00 */
  if(d2==="extend"&&(i===3||i===4))return n1;     /* extension ends 11:20 */
  return 0;
 }
 if(d2==="start1"&&(i===3||i===4))return 1;       /* late support: 11:00 → 11:20 */
 if(d2==="start2"&&(i===3||i===4))return 2;
 return 0;
}
const capOf=(agents,aht)=>Math.floor(agents*600/aht);
/* one source of truth: every number on screen comes from this ledger */
function runSim(d1,d2,upto){
 const q={A:TEAM.A.q0,B:TEAM.B.q0};
 const totals={A:0,B:0};
 const peak={A:TEAM.A.q0,B:TEAM.B.q0};            /* measurement points include the start */
 const periods=[];
 for(let i=0;i<upto;i++){
  const k=transferAt(d1,d2,i);
  const row={i,k,A:{},B:{}};
  KEYS.forEach(key=>{
   const agents=TEAM[key].agents0+(key==="A"?k:-k);
   const cap=capOf(agents,TEAM[key].aht);
   const open=q[key],inc=TEAM[key].arr[i];
   const avail=open+inc;
   const answered=Math.min(avail,cap);
   const close=avail-answered;
   totals[key]+=answered;
   if(close>peak[key])peak[key]=close;
   row[key]={agents,cap,open,inc,avail,answered,close};
   q[key]=close;
  });
  periods.push(row);
 }
 return {periods,q:Object.assign({},q),totals:Object.assign({},totals),peak,
  agentsNow:{A:TEAM.A.agents0+(upto>0?transferAt(d1,d2,upto-1):0),B:TEAM.B.agents0-(upto>0?transferAt(d1,d2,upto-1):0)}};
}
/* live state of the floor right now = after `done` periods, with no support still applied at 11:30 */
function floorNow(d1,d2,done){
 if(done===0)return {q:{A:TEAM.A.q0,B:TEAM.B.q0},agents:{A:TEAM.A.agents0,B:TEAM.B.agents0},k:0,
  totals:{A:0,B:0},cap:{A:capOf(TEAM.A.agents0,TEAM.A.aht),B:capOf(TEAM.B.agents0,TEAM.B.aht)}};
 const r=runSim(d1,d2,done),last=r.periods[done-1];
 const kNext=(done<6)?transferAt(d1,d2,done):0;    /* who is on the floor for the period about to run */
 const agents={A:TEAM.A.agents0+kNext,B:TEAM.B.agents0-kNext};
 return {q:r.q,agents,k:kNext,totals:r.totals,lastRow:last,
  cap:{A:capOf(agents.A,TEAM.A.aht),B:capOf(agents.B,TEAM.B.aht)}};
}
const REF=()=>runSim(0,"keep",6);                  /* reference path: no transfer all hour */
</script>

<script>

   <div style="margin-top:14px">${chart()}</div><div style="margin-top:14px">${logCard()}</div>`;
 if(S.period===0)body=vStage1();
 else if(ANIM)body=runView(ANIM.to>=6?3:1);        /* the destination decides the stage, not the clock */
 else if(S.period<3)body=runView(1);
 else if(S.period===3)body=vStage2();
 else body=S.period<6?runView(3):vEnd();
 return topbar(`<span class="clock n">${clk(done)}</span>`)+`<main id="main">${body}</main>`;
}
function render(){
 const v=S.screen==="intro"?vIntro:vPlay;
 document.getElementById("root").innerHTML=v();
 if(FOCUS){const el=document.querySelector('[data-fid="'+FOCUS+'"]');if(el&&el.focus)el.focus();FOCUS=null}
}
/* boot */
load();
document.documentElement.lang=S.lang;
document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
document.documentElement.setAttribute("data-t",S.theme==="auto"?"auto":S.theme);
render();
</script></body></html>
